<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>教育规划 Navigator · 家长版</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e6e8ef; --accent:#4f46e5; --accent-soft:#eef0ff;
    --ok:#16a34a; --warn:#d97706; --ok-soft:#e8f6ee; --warn-soft:#fdf3e3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; font-size:15px;
  }
  .wrap{max-width:760px; margin:0 auto; padding:18px 16px 60px}
  header.app{
    background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff;
    border-radius:16px; padding:20px 18px; margin-bottom:18px;
  }
  header.app h1{margin:0; font-size:20px; letter-spacing:.5px}
  header.app p{margin:6px 0 0; opacity:.9; font-size:13px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:16px; box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .card h2{margin:0 0 12px; font-size:16px; display:flex; align-items:center; gap:8px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 4px}
  input,textarea,select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--ink);
  }
  textarea{resize:vertical; min-height:60px}
  input:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .subj{border:1px dashed var(--line); border-radius:12px; padding:12px; margin-top:10px; transition:box-shadow .4s, border-color .4s}
  .subj.flash{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); background:var(--accent-soft)}
  .subj .row{display:grid; grid-template-columns:1fr 96px; gap:10px; align-items:end}
  .subj .row .grade input{text-align:center; font-weight:700}
  .subj .critgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:2px}
  .subj .critgrid input{text-align:center; font-size:14px; padding:8px 4px}
  .crit{display:inline-block; font-size:12px; padding:2px 9px; border-radius:999px; margin:0 2px; font-weight:600}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:12px; padding:13px 18px; font-size:15px; font-weight:600;
    background:var(--accent); color:#fff; cursor:pointer; width:100%; margin-top:14px;
  }
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff; color:var(--accent); border:1px solid var(--accent)}
  .btn.sm{width:auto; padding:9px 14px; font-size:13px; margin-top:8px}
  .pdfzone{border:1px solid var(--line); border-radius:12px; padding:12px; background:#fafbff}
  .pdfzone .hint{font-size:12px; color:var(--muted); margin:8px 0 0}
  #pdfStatus{margin-top:10px; font-size:13px; padding:9px 12px; border-radius:10px; display:none}
  #pdfStatus.show{display:block}
  #pdfStatus.ok{background:var(--ok-soft); color:var(--ok)}
  #pdfStatus.warn{background:var(--warn-soft); color:var(--warn)}
  #pdfStatus.err{background:#fdecec; color:#b91c1c}
  details.adv{margin-top:14px; font-size:13px; color:var(--muted)}
  details.adv summary{cursor:pointer}
  /* report */
  #report{display:none}
  .sec{border-left:3px solid var(--accent); padding:6px 0 6px 14px; margin:18px 0}
  .sec h3{margin:0 0 8px; font-size:15px}
  .sec p{margin:6px 0}
  .muted{color:var(--muted); font-size:13px}
  .tag{display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; margin-left:4px}
  .tag.ok{background:var(--ok-soft); color:var(--ok)}
  .tag.warn{background:var(--warn-soft); color:var(--warn)}
  ul.diag,ul.timeline{margin:6px 0; padding-left:20px}
  ul.diag li{margin:6px 0}
  ol.timeline{margin:6px 0; padding-left:20px}
  ol.timeline li{margin:8px 0}
  blockquote{margin:8px 0; padding:10px 12px; background:#f8f9fc; border-left:3px solid var(--line); border-radius:8px; font-size:13px; white-space:pre-wrap}
  .swot2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px}
  .swot-col{border-radius:12px; padding:12px 14px}
  .swot-col.ok{background:var(--ok-soft)}
  .swot-col.warn{background:var(--warn-soft)}
  .swot-h{font-weight:700; font-size:14px; margin-bottom:6px}
  .swot-col ul{margin:0; padding-left:18px}
  .swot-col li{margin:5px 0; font-size:14px}
  @media(max-width:480px){ .swot2{grid-template-columns:1fr} }
  ul.actions{margin:6px 0 0; padding-left:20px}
  ul.actions li{margin:9px 0; font-size:14px; line-height:1.45}
  ul.actions li .reason{display:block; font-size:12.5px; color:var(--muted); margin-top:3px; padding-left:2px; border-left:2px solid var(--line)}
  .kpi{display:flex; gap:10px; flex-wrap:wrap; margin:8px 0}
  .kpi .box{flex:1; min-width:120px; background:var(--accent-soft); border-radius:12px; padding:12px; text-align:center}
  .kpi .box b{display:block; font-size:22px; color:var(--accent)}
  .kpi .box span{font-size:12px; color:var(--muted)}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:2px}
  .chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:7px 12px; font-size:13px; cursor:pointer; user-select:none; background:#fff}
  .chip input{margin:0; width:auto}
  .chip.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600}
  .repeat{margin-top:4px}
  .repeat .row{display:grid; grid-template-columns:1.4fr 1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:end}
  .repeat .row.act{grid-template-columns:1.4fr 1fr 1.6fr auto}
  .repeat .row input{padding:8px 10px; font-size:14px}
  .repeat .del{border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--warn); cursor:pointer; font-size:13px; background:#fff}
  @media(max-width:480px){ .repeat .row,.repeat .row.act{grid-template-columns:1fr 1fr} .repeat .del{grid-column:1/-1} }
  @media print{
    header.app,.card#intake,.btn,#pdfStatus,details.adv{display:none !important}
    body{background:#fff}
    .wrap{max-width:100%}
    .card{border:none; box-shadow:none; padding:0}
    #report{display:block}
    .sec{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>教育规划 Navigator · 家长版</h1>
    <p>上传 / 填写孩子档案 → 一键生成 AI 诊断报告（IB MYP 适配 · 中英文通吃）</p>
  </header>

  <!-- ============ 录入端 ============ -->
  <section class="card" id="intake">
    <h2><span class="dot"></span>学生档案录入</h2>

    <div class="grid2">
      <div><label>姓名</label><input id="name" placeholder="如 Henry Mu" /></div>
      <div><label>年级</label><input id="grade" placeholder="如 7（G7）" inputmode="numeric" /></div>
    </div>
    <div class="grid2">
      <div><label>学校</label><input id="school" placeholder="如 Kang Chiao International School" /></div>
      <div><label>国籍</label><input id="nationality" list="natList" placeholder="如 德国 / German" />
        <datalist id="natList">
          <option value="中国"></option><option value="德国 / German"></option><option value="美国 / US"></option>
          <option value="英国 / UK"></option><option value="新加坡"></option><option value="加拿大"></option>
          <option value="澳大利亚"></option><option value="其他"></option>
        </datalist>
      </div>
    </div>

    <label>升学方向（目标驱动报告 · 可多选 + 自定义）</label>
    <div class="chips" id="directionChips">
      <label class="chip"><input type="checkbox" value="港三全奖" />港三全奖</label>
      <label class="chip"><input type="checkbox" value="牛剑" />牛津 / 剑桥</label>
      <label class="chip"><input type="checkbox" value="美Top30" />美本 Top30</label>
      <label class="chip"><input type="checkbox" value="欧陆公立(低免学费)" />欧陆公立(低免学费)</label>
      <label class="chip"><input type="checkbox" value="新加坡" />新加坡</label>
      <label class="chip"><input type="checkbox" value="加拿大" />加拿大</label>
      <label class="chip"><input type="checkbox" value="澳洲" />澳洲</label>
      <label class="chip"><input type="checkbox" value="多国联申" />多国联申</label>
    </div>
    <input id="directionCustom" placeholder="其他方向（自定义，如 日本 SGU / 荷兰研究型大学）" style="margin-top:8px" />

    <label style="margin-top:10px">性格与兴趣测评</label>
    <div class="grid2">
      <div>
        <label style="margin:0 0 4px">MBTI</label>
        <input id="mbti" list="mbtiList" placeholder="如 ESTP / INFP" />
        <datalist id="mbtiList">
          <option>ISTJ</option><option>ISFJ</option><option>INFJ</option><option>INTJ</option>
          <option>ISTP</option><option>ISFP</option><option>INFP</option><option>INTP</option>
          <option>ESTP</option><option>ESFP</option><option>ENFP</option><option>ENTP</option>
          <option>ESTJ</option><option>ESFJ</option><option>ENFJ</option><option>ENTJ</option>
        </datalist>
      </div>
      <div>
        <label style="margin:0 0 4px">Holland 代码（可多选）</label>
        <div class="chips" id="hollandChips">
          <label class="chip"><input type="checkbox" value="R" />R 现实型</label>
          <label class="chip"><input type="checkbox" value="I" />I 研究型</label>
          <label class="chip"><input type="checkbox" value="A" />A 艺术型</label>
          <label class="chip"><input type="checkbox" value="S" />S 社会型</label>
          <label class="chip"><input type="checkbox" value="E" />E 企业型</label>
          <label class="chip"><input type="checkbox" value="C" />C 常规型</label>
        </div>
      </div>
    </div>
    <label style="margin-top:10px">兴趣地图（标签 / 自由描述）</label>
    <textarea id="interestMap" placeholder="如 生物 · 编程 · 辩论 · 写作 · 机器人"></textarea>

    <label style="margin-top:10px">学业成绩（IB MYP · 四标准 A/B/C/D 各 0–8 + Final 1–7）</label>
    <div id="subjects"></div>

    <label style="margin-top:10px">英语标化 & 考试</label>
    <div class="grid2">
      <div><label style="margin:0 0 4px">TOEFL Junior</label><input id="toeflJunior" inputmode="numeric" placeholder="分数" /></div>
      <div><label style="margin:0 0 4px">TOEFL</label><input id="toefl" inputmode="numeric" placeholder="分数" /></div>
      <div><label style="margin:0 0 4px">IELTS</label><input id="ielts" inputmode="numeric" placeholder="分数" /></div>
      <div><label style="margin:0 0 4px">SAT / ACT</label><input id="sat" inputmode="numeric" placeholder="分数" /></div>
    </div>
    <div class="grid2" style="margin-top:8px">
      <div><label style="margin:0 0 4px">最近考试日期</label><input id="examDate" placeholder="如 2026-08" /></div>
      <div><label style="margin:0 0 4px">Service as Action 完成度</label><input id="saCount" type="number" min="0" max="7" placeholder="已完成 X / 7" /></div>
    </div>

    <div class="grid2" style="margin-top:8px">
      <div><label style="margin:0 0 4px">目标专业大类</label>
        <select id="major">
          <option>未定</option><option>STEM</option><option>人文社科</option><option>商科</option><option>艺术</option><option>医学</option><option>其他</option>
        </select>
      </div>
      <div><label style="margin:0 0 4px">申请目标年级</label><input id="applyGrade" type="number" min="1" max="12" placeholder="如 12（G12 申请）" /></div>
    </div>

    <label style="margin-top:10px">比赛奖项</label>
    <div class="repeat" id="compList"></div>
    <button class="btn ghost sm" id="addComp" type="button">+ 添加比赛</button>

    <label style="margin-top:10px">志愿者 / 社团 / Service as Action 活动</label>
    <div class="repeat" id="activityList"></div>
    <button class="btn ghost sm" id="addAct" type="button">+ 添加活动</button>

    <label style="margin-top:10px">老师评语（优点 + 改进点）</label>
    <textarea id="teacherComment" placeholder="粘贴学校报告中的 Comments / 老师评语，报告将引用其优点与改进点"></textarea>

    <div class="pdfzone" style="margin-top:14px">
      <label style="margin-top:0">📄 上传学校 PDF 报告（自动抽取辅助填表）</label>
      <input id="pdfFile" type="file" accept="application/pdf" />
      <div id="pdfStatus"></div>
      <p class="hint">解析失败也不会阻塞——未识别的字段可手动补。PDF 仅是"加速"，不是必需。</p>
      <details style="margin-top:8px">
        <summary class="muted" style="cursor:pointer;font-size:13px">无 PDF？粘贴报告原文自助识别</summary>
        <textarea id="pasteText" placeholder="把 PDF 里的纯文本粘贴到这里" style="margin-top:8px"></textarea>
        <button class="btn ghost sm" id="reparseBtn" type="button">粘贴原文重新识别</button>
      </details>
    </div>

    <details class="adv">
      <summary>进阶设置（可选）：粘贴 MiniMax Key 让 AI 润色结论</summary>
      <label>MiniMax API Key（仅存本机浏览器会话，不上传、不写文件）</label>
      <input id="miniKey" type="password" placeholder="粘贴后可让报告结论由 AI 生成" autocomplete="off" />
    </details>

    <button class="btn" id="generateBtn" type="button">生成诊断报告 →</button>
  </section>

  <!-- ============ 报告端 ============ -->
  <section id="report">
    <div class="card">
      <h2><span class="dot"></span>AI 诊断报告</h2>
      <div class="kpi" id="kpi"></div>

      <div class="sec"><h3>① 竞争力总览与结论</h3><div id="rConclusion"></div></div>
      <div class="sec"><h3>② IB 学科诊断</h3><div id="rDiag"></div></div>
      <div class="sec"><h3>③ 优势与待改进点（总结自老师评语）</h3><div id="rSwot"></div></div>
      <div class="sec"><h3>④ 长期升学方向（目标驱动）</h3><div id="rDirection"></div></div>
      <div class="sec"><h3>⑤ 行动清单（校内资源优先）</h3><div id="rActions"></div></div>
      <div class="sec"><h3>⑥ 年度路线图</h3><div id="rRoadmap"></div></div>

      <button class="btn ghost" id="exportBtn" type="button">导出家长版 PDF</button>
      <button class="btn ghost sm" id="backBtn" type="button" style="width:auto">← 返回修改</button>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// ===APP_START===
(function(){
  "use strict";
  var SUBJ = [
    {key:'math',      name:'数学',   re:/mathematics|math|数学/i},
    {key:'english',   name:'英语',   re:/english|英语/i},
    {key:'science',   name:'科学',   re:/sciences?|科学/i},
    {key:'chinese',   name:'中文',   re:/chinese|中文/i},
    {key:'humanities',name:'人文社科',re:/individuals\s+and\s+societies|humanities|人文/i}
  ];

  // ---- 渲染学科输入区 ----
  var subjectsBox = document.getElementById('subjects');
  SUBJ.forEach(function(s){
    var d = document.createElement('div');
    d.className = 'subj'; d.id = 'subj_'+s.key;
    d.innerHTML =
      '<div class="row">'+
        '<div><label style="margin:0 0 4px">'+s.name+'（四标准 A/B/C/D 各 0–8）</label>'+
          '<div class="critgrid">'+
            '<input id="subject_a_'+s.key+'" type="number" min="0" max="8" placeholder="A" inputmode="numeric" />'+
            '<input id="subject_b_'+s.key+'" type="number" min="0" max="8" placeholder="B" inputmode="numeric" />'+
            '<input id="subject_c_'+s.key+'" type="number" min="0" max="8" placeholder="C" inputmode="numeric" />'+
            '<input id="subject_d_'+s.key+'" type="number" min="0" max="8" placeholder="D" inputmode="numeric" />'+
          '</div></div>'+
        '<div class="grade"><label style="margin:0 0 4px">Final (1–7)</label>'+
          '<input id="subject_score_'+s.key+'" type="number" min="1" max="7" placeholder="1–7" inputmode="numeric" /></div>'+
      '</div>';
      subjectsBox.appendChild(d);
  });

  // ---- 录入端：升学方向 / Holland 标签切换 + 可增删行 ----
  document.querySelectorAll('.chips input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change', function(){ cb.closest('.chip').classList.toggle('on', cb.checked); });
  });
  function compRowHtml(){ return '<div class="row"><input class="c-name" placeholder="比赛名称" /><input class="c-level" placeholder="级别(校/市/国/国际)" /><input class="c-res" placeholder="结果(金/银/Top%)" /><button type="button" class="del" onclick="this.parentNode.remove()">✕</button></div>'; }
  function actRowHtml(){ return '<div class="row act"><input class="a-name" placeholder="活动/社团名称" /><input class="a-role" placeholder="角色" /><input class="a-desc" placeholder="说明" /><button type="button" class="del" onclick="this.parentNode.remove()">✕</button></div>'; }
  var compList=document.getElementById('compList'), actList=document.getElementById('activityList');
  document.getElementById('addComp').addEventListener('click', function(){ compList.insertAdjacentHTML('beforeend', compRowHtml()); });
  document.getElementById('addAct').addEventListener('click', function(){ actList.insertAdjacentHTML('beforeend', actRowHtml()); });
  compList.insertAdjacentHTML('beforeend', compRowHtml());
  actList.insertAdjacentHTML('beforeend', actRowHtml());

  function v(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
  function setV(id,val){ var el=document.getElementById(id); if(el&&val!=null&&val!==''){ el.value=val; } }
  function escapeHtml(t){ return (t||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // ---- PDF 文本抽取（按 y 坐标近似分行，保留结构）----
  async function extractPdfText(file){
    if(typeof pdfjsLib==='undefined') throw new Error('PDF 组件未加载（请检查网络后刷新）');
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({data:buf}).promise;
    var lines = [];
    for(var p=1; p<=pdf.numPages; p++){
      var page = await pdf.getPage(p);
      var tc = await page.getTextContent();
      var rows = {};
      tc.items.forEach(function(it){
        if(!it.str) return;
        var y = Math.round(it.transform[5]);
        if(!rows[y]) rows[y] = [];
        rows[y].push(it.str);
      });
      Object.keys(rows).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){
        lines.push(rows[y].join(' '));
      });
    }
    return lines.join('\n');
  }

  // ---- 从文本回填表单 ----
  function fillFromText(text){
    var count=0, found=[];
    var m;
    m = text.match(/Student\s*Name\s*[:\-]\s*([^\n]*?)(?=\s+Student\s+ID\s*:|$)/i);
    if(m){ var nm=m[1].trim(); if(nm){ setV('name', nm); count++; found.push('姓名'); } }

    m = text.match(/(?<!final\s)grade\s*[:\-]\s*([^\n]+)/i);
    if(m){ var g=m[1].match(/\d+/); if(g){ setV('grade', g[0]); count++; found.push('年级'); } }

    m = text.match(/(.+?(?:school|academy|college|学校))\b/i);
    if(m){ setV('school', m[1].trim()); count++; found.push('学校'); }
    else { m = text.match(/(kang\s*chiao|kangqiao|康桥)[^\n]*/i); if(m){ setV('school', m[0].trim()); count++; found.push('学校'); } }

    m = text.match(/nationality\s*[:\-]\s*([^\n]+)/i);
    if(m){ setV('nationality', m[1].trim()); count++; found.push('国籍'); }

    // ---- 学业成绩：优先解析汇总表（Final + A/B/C/D 四标准）----
    var lines = text.split('\n');
    var sumStart = -1;
    for(var si=0; si<lines.length; si++){ if(/achievement levels/i.test(lines[si]) && /final grade/i.test(lines[si])){ sumStart=si; break; } }
    var sumEnd = lines.length;
    if(sumStart>=0){ for(var ei=sumStart; ei<lines.length; ei++){ if(/interdisciplinary/i.test(lines[ei])){ sumEnd=ei; break; } } }
    var scores = {};
    if(sumStart>=0){
      for(var i=sumStart; i<sumEnd; i++){
        var ln=lines[i].trim(); var key=null;
        for(var k=0;k<SUBJ.length;k++){ if(SUBJ[k].re.test(ln)){ key=SUBJ[k].key; break; } }
        if(!key) continue;
        var fg=null, abcd=null;
        for(var j=i+1; j<Math.min(i+6,lines.length); j++){
          var t=lines[j].trim();
          var m1=t.match(/^(\d{1,2})$/); if(m1){ var n=parseInt(m1[1],10); if(n>=1&&n<=7&&fg==null) fg=n; }
          var m4=t.match(/^(\d)\s+(\d)\s+(\d)\s+(\d)$/); if(m4) abcd=[+m4[1],+m4[2],+m4[3],+m4[4]];
        }
        if(fg!=null || abcd!=null) scores[key]={fg:fg, abcd:abcd};
      }
    }
    // 兜底：无汇总表时退化为逐行邻近匹配（兼容其他 IB 报告格式）
    if(Object.keys(scores).length===0){
      var idx=[];
      lines.forEach(function(ln,i){ for(var k=0;k<SUBJ.length;k++){ if(SUBJ[k].re.test(ln)){ idx.push({i:i,f:SUBJ[k].key}); break; } } });
      idx.forEach(function(sb,bi){
        var end=(bi+1<idx.length)?idx[bi+1].i:lines.length;
        var block=lines.slice(sb.i,end).join('\n');
        var fg=block.match(/final\s*grade\s*[:\-]?\s*([1-7])/i);
        var cMap={A:null,B:null,C:null,D:null}; var cm; var cre=/([A-Da-d])\s*[:.\-]?\s*(\d{1,2})/g;
        while((cm=cre.exec(block))!==null){ var L=cm[1].toUpperCase(); var n=parseInt(cm[2],10); if((L in cMap)&&n>=0&&n<=8) cMap[L]=n; }
        if(cMap.A==null||cMap.B==null||cMap.C==null||cMap.D==null){
          var bn=block.replace(/final\s*grade\s*[:\-]?\s*\d+/i,' '); var nums=[]; var nm; var nre=/\b(\d{1,2})\b/g;
          while((nm=nre.exec(bn))!==null){ var nx=parseInt(nm[1],10); if(nx>=0&&nx<=8) nums.push(nx); }
          var ni=0; ['A','B','C','D'].forEach(function(K){ if(cMap[K]==null&&ni<nums.length) cMap[K]=nums[ni++]; });
        }
        scores[sb.f]={fg: fg?fg[1]:null, abcd:null, cMap:cMap};
      });
    }
    SUBJ.forEach(function(s){
      var r=scores[s.key]; if(!r) return;
      if(r.fg!=null){ setV('subject_score_'+s.key, r.fg); count++; found.push(s.name+'成绩'); }
      var ab = (r.abcd)? r.abcd : (r.cMap? [r.cMap.A,r.cMap.B,r.cMap.C,r.cMap.D] : null);
      if(ab){ ['A','B','C','D'].forEach(function(K,ki){ if(ab[ki]!=null) setV('subject_'+K.toLowerCase()+'_'+s.key, ab[ki]); }); count++; found.push(s.name+'四标准'); }
    });

    // ---- 老师评语：从详情段按"最近科目头"归属，跳过分页噪声 ----
    var NOISE=/Henry\s*Mu|Kang Chiao|Academic Yearly Report|^Page \d|No\.\s*\d|Xihuan|Huaqiao|Kunshan|Jiangsu|215332|Interdisciplinary|Boundaries|Grade\s+Descriptor|^\s*$/i;
    var headers=[];
    for(var hi=sumEnd; hi<lines.length; hi++){
      for(var k=0;k<SUBJ.length;k++){
        if(SUBJ[k].re.test(lines[hi]) && (/g7\s/i.test(lines[hi]) || /phase\s*3/i.test(lines[hi]))){ headers.push({i:hi,key:SUBJ[k].key}); break; }
      }
    }
    var commentsMap={};
    headers.forEach(function(H,idx){
      var nextPos=(idx+1<headers.length)? headers[idx+1].i : lines.length;
      for(var i=H.i; i<nextPos; i++){
        if(/comments?\s*:/i.test(lines[i])){
          var txt=[];
          for(var j=i+1; j<Math.min(nextPos, i+25); j++){
            var l=lines[j].trim();
            if(/^[A-Z][a-z]+ [A-Z][a-z]+:/.test(l) && /G7|Phase|Language|Individual|Science|Math|Music|Visual|Physical|Design|Adventure/i.test(l)) break;
            if(/^\s*Comments:\s*$/i.test(l)) break;
            if(NOISE.test(l)){ if(txt.length) break; else continue; }
            txt.push(l);
          }
          commentsMap[H.key]=txt.join(' ').replace(/\s+/g,' ').trim(); break;
        }
      }
    });
    var commentsAll=[];
    SUBJ.forEach(function(s){ if(commentsMap[s.key]) commentsAll.push(s.name+'：'+commentsMap[s.key]); });
    if(commentsAll.length){ setV('teacherComment', commentsAll.join('\n')); count++; found.push('老师评语'); }

    // 高亮学业成绩区
    SUBJ.forEach(function(s){ var box=document.getElementById('subj_'+s.key); if(box && v('subject_score_'+s.key)){ box.classList.add('flash'); setTimeout(function(){box.classList.remove('flash');},2200); } });
    return {count:count, found:found};
  }

  function critList(subj){
    var out=[];
    [['A',subj.a],['B',subj.b],['C',subj.c],['D',subj.d]].forEach(function(pair){
      if(pair[1]!=null) out.push({L:pair[0], n:pair[1]});
    });
    return out;
  }

  function critChip(c){
    var cls = c.n>=8?'ok':(c.n<=6?'warn':'');
    return '<span class="crit '+(cls?('tag '+cls):'muted')+'">'+c.L+c.n+'</span>';
  }
  function ibDiag(p){
    var html='<ul class="diag">'; var scores=[];
    SUBJ.forEach(function(s){
      var subj=p.subjects[s.key];
      var cl = critList(subj);
      if(subj.score==null && cl.length===0) return;
      if(subj.score!=null) scores.push(subj.score);
      html += '<li><b>'+s.name+'</b>';
      if(subj.score!=null) html += '：Final <b>'+subj.score+'/7</b>';
      if(cl.length) html += '　<span class="muted">评测明细</span> '+cl.map(critChip).join(' ');
      html += '</li>';
    });
    html += '</ul>';
    var avg = scores.length ? (scores.reduce(function(a,b){return a+b;},0)/scores.length).toFixed(1) : '—';
    return {html:html, avg:avg};
  }

  function actions(p){
    var items=[];
    function add(title, reason){ items.push({title:title, reason:reason}); }
    // 1) 学科弱项（基于录入的四标准 / Final）
    SUBJ.forEach(function(s){
      var subj=p.subjects[s.key];
      if(subj.score==null && !subj.a && !subj.b && !subj.c && !subj.d) return;
      var weak = critList(subj).filter(function(c){return c.n<=6;});
      if(!(subj.score!=null && subj.score<=6) && !weak.length) return;
      var parts=[];
      if(subj.score!=null && subj.score<=6) parts.push(s.name+' Final Grade '+subj.score+'/7（低于 7 分档）');
      if(weak.length) parts.push(s.name+' 四标准弱项：'+weak.map(function(c){return c.L+c.n;}).join('、'));
      var reason = '基于档案录入：'+parts.join('；')+'。';
      (ACTION_MAP[s.key]||[]).forEach(function(r){ add('校内 · '+r, reason); });
    });
    // 2) 升学方向联动（基于录入方向 + 标化字段）
    var dirTxt = (p.direction||[]).join('、');
    if(/美Top30/.test(dirTxt) && !p.sat){
      add('备考 SAT / ACT（美本 Top30 硬通货）', '升学方向含「美 Top30」，但档案未填写 SAT/ACT 成绩——该方向几乎都要求标化，缺失将直接削弱竞争力。');

    }
    // 3) Service as Action（基于录入完成度）
    if(p.saCount && parseInt(p.saCount,10)<7){
      add('补满 Service as Action '+p.saCount+'/7', '档案 Service as Action 完成度 = '+p.saCount+'/7，未达 IB 硬性 7/7 要求，将影响 DP 阶段升学资格评估。');
    }
    // 4) 竞赛（基于录入）
    if(p.competitions && p.competitions.length){
      add('沉淀已获奖项为申请素材', '档案已录入 '+p.competitions.length+' 项比赛：'+p.competitions.map(function(c){return c.name+(c.res?'（'+c.res+'）':'');}).join('、')+'——需在文书与简历中重点突出。');
    }
    // 5) 活动（基于录入）
    if(p.activities && p.activities.length){
      add('写入 CAS / 活动列表', '档案已录入 '+p.activities.length+' 项活动/社团：'+p.activities.map(function(a){return a.name;}).join('、')+'——构成申请活动主线。');
    }
    // 兜底
    if(!items.length){
      add('维持各科 7 分档，冲刺高阶竞赛', '档案各学科 Final 均 ≥7 且四标准无 ≤6 弱项，暂无紧急学术补救；建议持续拔高。');
      add('补满 Service as Action 7/7', 'IB 硬性要求 7/7；即便当前无弱项，也应尽早达标以满足升学资格。');
    }
    var html = '<p class="muted">以下行动按「档案暴露的风险」排序，优先校内资源。每条均标注触发原因：</p><ul class="actions">';
    items.forEach(function(it){
      html += '<li><b>'+escapeHtml(it.title)+'</b>';
      if(it.reason) html += '<span class="reason">原因：'+escapeHtml(it.reason)+'</span>';
      html += '</li>';
    });
    html += '</ul>';
    return html;
  }

  function uniq(arr){ var seen={}, out=[]; arr.forEach(function(x){ if(!seen[x]){seen[x]=1; out.push(x);} }); return out; }
  function condense(seg){
    var dict = [
      [/strong analytical ability/i,'分析能力强'],
      [/excellent participation/i,'课堂参与积极'],
      [/good inquiry/i,'探究能力强'],
      [/outstanding critical thinking/i,'批判性思维突出'],
      [/critical thinking/i,'批判性思维'],
      [/structured presentation/i,'结构化表达'],
      [/broaden vocabulary/i,'拓展词汇量'],
      [/more depth in lab write[\s\-]*ups/i,'实验报告更深入'],
      [/literary criticism/i,'文学批评结构'],
      [/expression/i,'表达'],
      [/creativity|creative/i,'创造力']
    ];
    var out = seg;
    dict.forEach(function(d){ out = out.replace(d[0], d[1]); });
    out = out.replace(/^(?:(?:henry|the student|student|he|she|老师|该生|shows|has|demonstrates|exhibits|is|displays|建议|需|需要|should|needs to|needs|develops?|work on|must|to)\s+)+/i,'');
    out = out.replace(/^[建议需加强提升改善待改进补充]+/,'');
    out = out.replace(/\s+/g,' ').trim();
    if(!out) out = seg.trim();
    return out.charAt(0).toUpperCase()+out.slice(1);
  }
  // 优点主题：把一句话归并到"主要主题"，避免逐句罗列、中英混杂
  function mapTheme(bullet){
    var rules = [
      [/书写|handwrit|字迹/i, '书写工整度突出'],
      [/写作|文学|创作|creative|write|创作满分|表达力|expression/i, '表达与创作力突出'],
      [/分析|探究|批判|思维|推理|analyt|inquir|critical|thinking|reflect|infer/i, '分析推理与探究能力强'],
      [/prioriti|plan|visuali[sz]e steps|planning tools|目标设定|规划/i, '规划与组织能力强'],
      [/cooperat|helpful|peer|sociali[sz]|group|volunteer|classroom leader|above and beyond|帮扶|助人|合作/i, '合作助人、课堂领导力'],
      [/participat|discuss|课堂|interaction|exchange thoughts|发言|互动/i, '课堂参与积极'],
      [/knowledge|skilled|capable|exam results|subject knowledge|achievement|学业|基础|扎实|知识面广/i, '学业基础扎实'],
      [/leader|leadership|领导力/i, '领导力突出'],
      [/progress|motivat|independent learner|self-motivat|主动|进步/i, '自主学习主动、进步明显'],
      [/confident|enthusiastic|积极/i, '学习态度积极']
    ];
    for(var i=0;i<rules.length;i++){ if(rules[i][0].test(bullet)) return rules[i][1]; }
    return bullet;
  }
  // 待改进主题：明确"可加强"措辞，与优点列区分
  function improveTheme(raw){
    if(/书写|handwrit|字迹/i.test(raw)) return '书写工整度待提升';
    if(/broaden|vocabulary|词汇/i.test(raw)) return '英语词汇量有待拓展';
    if(/structur|organi[sz]ing sources|书面结构/i.test(raw)) return '书面结构与表达待加强';
    if(/lab|experiment|实验|报告|depth/i.test(raw)) return '科学实验与报告深度待提升';
    if(/prioriti|plan|目标|规划/i.test(raw)) return '规划与目标设定可进一步加强';
    if(/participat|discuss|interaction|exchange|发言|互动|交流/i.test(raw)) return '课堂参与与交流可进一步加强';
    if(/risk|challenging|挑战|探索新/i.test(raw)) return '可尝试更高难度挑战';
    return '可在'+(mapTheme(condense(raw)))+'方面继续加强';
  }
  function rootOf(t){
    if(/自主/.test(t)) return '自主';
    if(/规划/.test(t)) return '规划';
    if(/书写|字迹/.test(t)) return '书写';
    if(/词汇/.test(t)) return '词汇';
    if(/表达|创作|写作/.test(t)) return '表达';
    if(/分析|批判|探究|推理/.test(t)) return '分析';
    if(/合作|助人|领导/.test(t)) return '合作';
    if(/参与|互动|交流|发言/.test(t)) return '参与';
    if(/学业|基础|知识/.test(t)) return '学业';
    if(/实验|科学/.test(t)) return '科学';
    if(/积极|态度/.test(t)) return '态度';
    return t;
  }
  function summarizeComments(p){
    var c = p.teacherComment||'';
    if(!c.trim()) return null;
    var strengths=[], improve=[];
    c.split(/\n/).forEach(function(line){
      var ci = line.indexOf('：');
      var text = (ci>=0)? line.slice(ci+1) : line;
      text.split(/[.!?。！？]+/).forEach(function(raw){
        raw = raw.trim(); if(!raw) return;
        // 过滤泛化评语（以 "students" 为主语、描述全班而非 Henry）
        if(/^(in \w+ (this|the) year, students|students (focused|learned|explored|started|were encouraged))/i.test(raw)) return;
        var isImp = /need|should|improve|weak|待|需|加强|work on|建议|提升|lacks|develop|broaden|depth|further|more|encouraged to|encourage/i.test(raw);
        var theme = mapTheme(condense(raw));
        if(theme === condense(raw)) return; // 未命中主题（多为英文原句），跳过以免混杂
        if(isImp) improve.push(improveTheme(raw));
        else strengths.push(theme); // 中性句默认归优点
      });
    });
    var st = uniq(strengths).slice(0,3);
    var im = uniq(improve);
    // 移除与优点同根的待改进项，避免“既夸又批”的自相矛盾（如数学夸规划、英语说规划待加强）
    var sRoots = st.map(rootOf);
    im = im.filter(function(x){ return sRoots.indexOf(rootOf(x))<0; });
    // 具体弱点（待提升/待加强/待深入）优先，确保不被截断
    im.sort(function(a,b){ var ca=/待提升|待加强|待深入/.test(a)?0:1, cb=/待提升|待加强|待深入/.test(b)?0:1; return ca-cb; });
    im = im.slice(0,3);
    return { strengths: st, improve: im };
  }
  function swot(p){
    var s = summarizeComments(p);
    if(!s) return '<p class="muted">未录入老师评语（建议补填，报告将引用优点与改进点）。</p>';
    var h = '<div class="swot2">';
    h += '<div class="swot-col ok"><div class="swot-h">🌟 主要优点</div><ul class="diag">';
    h += s.strengths.length ? s.strengths.map(function(x){return '<li>'+escapeHtml(x)+'</li>';}).join('') : '<li class="muted">评语中未显式标注优点</li>';
    h += '</ul></div>';
    h += '<div class="swot-col warn"><div class="swot-h">🔧 主要待改进点</div><ul class="diag">';
    h += s.improve.length ? s.improve.map(function(x){return '<li>'+escapeHtml(x)+'</li>';}).join('') : '<li class="muted">评语中未显式标注待改进点（可结合分数偏弱项判断）</li>';
    h += '</ul></div>';
    h += '</div>';
    return h;
  }

  async function maybeEnrich(profile, key){
    if(!key) return null;
    try{
      var prompt = '你是升学规划顾问。基于学生档案用一句中文给出竞争力结论（含身份维度）：'+JSON.stringify(profile);
      var res = await fetch('https://api.minimax.chat/v1/text/chatcompletion_v2', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
        body:JSON.stringify({model:'abab6.5s-chat', messages:[{role:'user',content:prompt}]})
      });
      var data = await res.json();
      return (data && (data.reply || (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content))) || null;
    }catch(e){ return null; }
  }

  // ---- 生成报告 ----
  document.getElementById('generateBtn').addEventListener('click', async function(){
    var p = getProfile();
    var diag = ibDiag(p);
    var concl = conclusion(p, diag.avg);
    var key = v('miniKey');
    if(key){
      var ai = await maybeEnrich(p, key);
      if(ai) concl = '🤖 '+ai;
    }
    document.getElementById('kpi').innerHTML =
      '<div class="box"><b>'+(diag.avg)+'</b><span>IB 平均 Final Grade</span></div>'+
      '<div class="box"><b>'+SUBJ.filter(function(s){return p.subjects[s.key].score!=null;}).length+'/5</b><span>已录学科</span></div>'+
      '<div class="box"><b>'+(p.direction&&p.direction.length?p.direction.length+' 向':'—')+'</b><span>升学方向</span></div>'+
      '<div class="box"><b>'+(/德|german|germany/i.test(p.nationality||'')?'国际生池':'—')+'</b><span>申请身份</span></div>';

    document.getElementById('rConclusion').innerHTML = '<p>'+concl+'</p>';
    document.getElementById('rDiag').innerHTML = diag.html;
    document.getElementById('rSwot').innerHTML = swot(p);
    document.getElementById('rDirection').innerHTML = '<p>'+direction(p)+'</p>';
    document.getElementById('rActions').innerHTML = actions(p);
    document.getElementById('rRoadmap').innerHTML = roadmap(p);

    document.getElementById('intake').style.display='none';
    document.getElementById('report').style.display='block';
    window.scrollTo(0,0);
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    document.getElementById('report').style.display='none';
    document.getElementById('intake').style.display='block';
    window.scrollTo(0,0);
  });
  document.getElementById('exportBtn').addEventListener('click', function(){ window.print(); });
})();
